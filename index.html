<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6b4f33">
  <meta name="description" content="Cuaderno de Panadería Años 40 — Recetas, flujos y secretos del obrador">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>Cuaderno de Panadería · Años 40</title>
  <style>
    /* ===== ESTILO PANADERÍA AÑOS 40 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f3efe6;
      background-image: radial-gradient(circle at 20% 30%, #e8e0d0 0%, #d9cfbc 100%);
      font-family: 'Georgia', 'Times New Roman', 'Palatino', serif;
      color: #2c2418;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.06"/></svg>');
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ===== CABECERA ===== */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 3px double #8b6b4d;
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4a3727;
      text-shadow: 2px 2px 0 #d9c9b0;
      margin-bottom: 0.25rem;
    }

    .header .sub {
      font-size: 1.1rem;
      font-style: italic;
      color: #6b5a45;
      letter-spacing: 2px;
    }

    .header .decoration {
      font-size: 1.8rem;
      letter-spacing: 8px;
      color: #b8956e;
      margin-top: 0.25rem;
    }

    /* ===== ESTADO DE CARGA ===== */
    .status-bar {
      background: #f9f4ea;
      border: 1.5px solid #b89b7a;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-radius: 2px;
    }

    .status-bar .status-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #6b4f33;
    }

    .status-bar .status-item strong {
      color: #4a3727;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .status-bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b85c3a;
      display: inline-block;
    }

    .status-bar .dot.ok { background: #5a8b5a; }
    .status-bar .dot.loading { background: #d4a017; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-bar .btn-reload {
      font-family: 'Georgia', serif;
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      cursor: pointer;
      color: #4a3727;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-bar .btn-reload:hover { background: #e8ddc9; }

    /* ===== PANEL DE CONTROL ===== */
    .control-panel {
      background: #f9f4ea;
      border: 2px solid #b89b7a;
      border-radius: 2px;
      box-shadow: 4px 4px 0 #b89b7a, 8px 8px 0 rgba(0,0,0,0.05);
      padding: 1.75rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
      align-items: flex-end;
      justify-content: center;
    }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }

    .field label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b4f33;
      font-weight: bold;
    }

    .field select, .field input {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1rem;
      padding: 0.5rem 0.75rem;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      color: #2c2418;
      min-width: 200px;
    }

    .field select:focus, .field input:focus {
      outline: 2px solid #b8956e;
      outline-offset: 1px;
    }

    .btn {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 0.65rem 1.8rem;
      background: #6b4f33;
      color: #f9f4ea;
      border: 2px solid #4a3727;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #4a3727;
      transition: all 0.1s ease;
      font-weight: bold;
    }

    .btn:hover {
      background: #8b6b4d;
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #4a3727;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 #4a3727;
    }

    .btn:disabled {
      background: #b0a08c;
      cursor: not-allowed;
      box-shadow: 3px 3px 0 #8b7a66;
    }

    .btn-print { background: #8b6b4d; }

    /* ===== ÁREA DE RECETA ===== */
    .recipe-container {
      background: #fdfaf4;
      border: 2px solid #b89b7a;
      box-shadow: 6px 6px 0 #b89b7a, 12px 12px 0 rgba(0,0,0,0.04);
      padding: 2.5rem 3rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .recipe-container::before {
      content: "";
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px solid #d9c9b0;
      pointer-events: none;
    }

    .recipe-header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 2px solid #d9c9b0;
      padding-bottom: 1rem;
      position: relative;
    }

    .recipe-header h2 {
      font-size: 2.4rem;
      font-weight: normal;
      color: #3d2e1f;
      letter-spacing: 2px;
      margin-bottom: 0.25rem;
    }

    .recipe-header .icon-large { font-size: 2rem; margin-right: 0.5rem; }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem 2.5rem;
      margin-top: 0.75rem;
      font-size: 1rem;
      color: #5a4630;
    }

    .recipe-meta span {
      background: #f3ede3;
      padding: 0.25rem 0.9rem;
      border-radius: 20px;
      border: 1px solid #d9c9b0;
      font-style: italic;
    }

    .recipe-meta strong { font-style: normal; color: #4a3727; }

    /* ===== SECCIONES ===== */
    .section-title {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #6b4f33;
      border-bottom: 2px solid #d9c9b0;
      padding-bottom: 0.35rem;
      margin: 2rem 0 1.25rem 0;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title .ornament { font-size: 1.2rem; color: #b8956e; }

    /* ===== CALENDARIO ETERNO ===== */
    .calendar-box {
      background: #f3ede3;
      border: 2px dashed #b89b7a;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 2rem;
      justify-content: center;
    }

    .calendar-box .cal-item { font-size: 1rem; color: #3d2e1f; }

    .calendar-box .cal-item strong {
      color: #6b4f33;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.8rem;
      display: block;
    }

    .calendar-box .cal-item .value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #4a3727;
      font-family: 'Georgia', serif;
    }

    /* ===== TABLA DE INGREDIENTES ===== */
    .multiplier-bar {
      background: #f3ede3;
      border: 2px solid #b89b7a;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      justify-content: center;
    }

    .multiplier-bar .label-mult {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b4f33;
      font-weight: bold;
    }

    .multiplier-bar input[type="number"] {
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      padding: 0.4rem 0.6rem;
      width: 90px;
      text-align: center;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      color: #2c2418;
      font-weight: bold;
    }

    .mult-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .mult-btn {
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      padding: 0.35rem 0.8rem;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      cursor: pointer;
      color: #4a3727;
      font-weight: bold;
      transition: all 0.1s ease;
    }

    .mult-btn:hover { background: #e8ddc9; }

    .mult-btn.active {
      background: #6b4f33;
      color: #f9f4ea;
      border-color: #4a3727;
    }

    .resumen-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 2rem;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      background: #fffcf7;
      border: 1px solid #d9c9b0;
      font-size: 0.95rem;
      color: #3d2e1f;
    }

    .resumen-bar strong {
      color: #6b4f33;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      display: block;
    }

    .resumen-bar .val {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4a3727;
    }

    .ing-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .ing-table th {
      background: #6b4f33;
      color: #f9f4ea;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.78rem;
      padding: 0.6rem 0.75rem;
      text-align: left;
      border: 1px solid #4a3727;
    }

    .ing-table td {
      padding: 0.55rem 0.75rem;
      border: 1px solid #d9c9b0;
      background: #fffcf7;
      vertical-align: middle;
    }

    .ing-table tr:nth-child(even) td { background: #f9f4ea; }

    .ing-table .group-title {
      background: #e8ddc9 !important;
      font-weight: bold;
      color: #4a3727;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
    }

    .ing-table .col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ing-table .col-pct {
      text-align: right;
      color: #6b5a45;
      font-style: italic;
      white-space: nowrap;
    }

    .ing-table .col-scaled {
      text-align: right;
      font-weight: bold;
      color: #4a3727;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ing-table .harina-row td {
      background: #f2e8d5 !important;
      font-weight: bold;
    }

    .ing-table .no-pct td.col-pct { color: #b0a08c; }

    /* ===== FLUJO ===== */
    .flow-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .flow-table th {
      background: #6b4f33;
      color: #f9f4ea;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.8rem;
      padding: 0.6rem 0.75rem;
      text-align: left;
      border: 1px solid #4a3727;
    }

    .flow-table td {
      padding: 0.65rem 0.75rem;
      border: 1px solid #d9c9b0;
      vertical-align: top;
      background: #fffcf7;
    }

    .flow-table tr:nth-child(even) td { background: #f9f4ea; }
    .flow-table .stage-name { font-weight: bold; color: #4a3727; }
    .flow-table .stage-dur { white-space: nowrap; font-style: italic; color: #6b5a45; }
    .flow-table .stage-desc { color: #3d2e1f; }

    /* ===== CONSIDERACIONES ===== */
    .considerations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .consideration-card {
      background: #f9f4ea;
      border-left: 4px solid #b8956e;
      padding: 0.9rem 1rem;
      border-radius: 0 2px 2px 0;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.04);
    }

    .consideration-card .cons-title {
      font-weight: bold;
      color: #4a3727;
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    .consideration-card .cons-text {
      font-size: 0.92rem;
      color: #3d2e1f;
      line-height: 1.5;
    }

    .consideration-card.warn { border-left-color: #b85c3a; background: #fcf4ef; }
    .consideration-card.ok { border-left-color: #5a8b5a; background: #f2f7f0; }

    /* ===== BPM TABLA ===== */
    .bpm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .bpm-table th {
      background: #8b6b4d;
      color: #f9f4ea;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.75rem;
      padding: 0.5rem 0.6rem;
      text-align: left;
      border: 1px solid #6b4f33;
    }

    .bpm-table td {
      padding: 0.5rem 0.6rem;
      border: 1px solid #d9c9b0;
      background: #fffcf7;
      vertical-align: top;
    }

    .bpm-table tr:nth-child(even) td { background: #f9f4ea; }

    /* ===== TIPS ===== */
    .tips-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 0.75rem;
    }

    .tips-list li {
      background: #f9f4ea;
      padding: 0.6rem 1rem 0.6rem 2.2rem;
      border: 1px solid #d9c9b0;
      position: relative;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .tips-list li::before {
      content: "✦";
      position: absolute;
      left: 0.7rem;
      top: 0.6rem;
      color: #b8956e;
      font-size: 1rem;
    }

    .print-area { text-align: center; margin: 2rem 0 1rem; }

    /* ===== MENSAJES ===== */
    .mensaje {
      background: #fcf4ef;
      border: 2px solid #b85c3a;
      padding: 1.5rem;
      margin: 1rem 0;
      text-align: center;
      color: #4a3727;
      border-radius: 2px;
    }

    .mensaje.info {
      background: #f2f7f0;
      border-color: #5a8b5a;
    }

    .mensaje h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .mensaje p { font-size: 0.95rem; line-height: 1.5; }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #b89b7a;
      border-top-color: #6b4f33;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .header h1 { font-size: 2rem; letter-spacing: 2px; }
      .recipe-container { padding: 1.5rem; }
      .recipe-header h2 { font-size: 1.7rem; }
      .control-panel { flex-direction: column; align-items: stretch; }
      .field select, .field input { min-width: auto; width: 100%; }
    }

    /* ===== IMPRESIÓN ===== */
    @media print {
      body { background: white; padding: 0.5cm; font-size: 11pt; }
      body::before { display: none; }
      .wrapper { max-width: 100%; }
      .control-panel, .print-area, .no-print, .status-bar { display: none !important; }
      .recipe-container {
        box-shadow: none;
        border: 1px solid #000;
        padding: 0.8cm;
        margin: 0;
        page-break-inside: avoid;
      }
      .recipe-container::before { display: none; }
      .header { border-bottom: 2px solid #000; }
      .header h1 { font-size: 22pt; text-shadow: none; }
      .section-title { border-bottom: 1px solid #000; color: #000; margin-top: 1cm; }
      .flow-table th, .bpm-table th, .ing-table th {
        background: #ddd; color: #000; border: 1px solid #000;
      }
      .flow-table td, .bpm-table td, .ing-table td {
        border: 1px solid #999; background: white !important;
      }
      .ing-table .group-title { background: #eee !important; }
      .ing-table .harina-row td { background: #f0f0f0 !important; }
      .consideration-card { border-left: 3px solid #666; background: #f5f5f5 !important; box-shadow: none; }
      .consideration-card.warn { border-left-color: #a00; }
      .consideration-card.ok { border-left-color: #060; }
      .tips-list li { background: #f5f5f5 !important; border: 1px solid #999; }
      .calendar-box { border: 1px dashed #666; background: #f5f5f5 !important; }
      .calendar-box .cal-item .value { color: #000; }
      .multiplier-bar { background: #f5f5f5 !important; border: 1px solid #666; }
      .resumen-bar { background: #f5f5f5 !important; border: 1px solid #666; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <header class="header">
    <h1>Cuaderno de Panadería</h1>
    <div class="sub">Recetas, flujos y secretos del obrador · Años 40</div>
    <div class="decoration">✦ ✦ ✦</div>
  </header>

  <!-- ===== BARRA DE ESTADO ===== -->
  <div class="status-bar no-print" id="statusBar">
    <div class="status-item">
      <span class="dot loading" id="statusDot"></span>
      <strong>Base:</strong>
      <span id="statusText">Cargando…</span>
    </div>
    <div class="status-item">
      <strong>Recetas:</strong>
      <span id="statusCount">—</span>
    </div>
    <div class="status-item">
      <strong>Versión:</strong>
      <span id="statusVersion">—</span>
    </div>
    <button class="btn-reload" id="btnReload">↻ Recargar base</button>
  </div>

  <!-- ===== PANEL DE CONTROL ===== -->
  <div class="control-panel no-print">
    <div class="field">
      <label for="recetaSelect">Elegir receta</label>
      <select id="recetaSelect" disabled>
        <option value="">— Cargando —</option>
      </select>
    </div>
    <div class="field">
      <label for="fechaInput">Fecha de inicio</label>
      <input type="date" id="fechaInput">
    </div>
    <div class="field">
      <label for="horaInput">Hora de inicio</label>
      <input type="time" id="horaInput" value="06:00">
    </div>
    <button class="btn" id="btnGenerar" disabled>Generar ficha</button>
  </div>

  <!-- ===== ÁREA DE RECETA ===== -->
  <div id="recipeOutput" class="recipe-container" style="display: none;"></div>

  <!-- ===== MENSAJES ===== -->
  <div id="mensajes"></div>

  <!-- ===== BOTÓN IMPRIMIR ===== -->
  <div class="print-area no-print" id="printArea" style="display: none;">
    <button class="btn btn-print" onclick="window.print()">🖨 Imprimir ficha</button>
  </div>

</div>

<script>
  // ============================================================
  // ESTADO GLOBAL DE LA APP
  // ============================================================
  const APP = {
    recetas: [],
    categorias: {},
    referencias: {},
    config: {},
    cargado: false,
    usandoFallback: false
  };

  // ============================================================
  // FALLBACK: datos mínimos embebidos (por si falla el fetch)
  // ============================================================
  const FALLBACK_RECETAS = [
    {
      id: "flautas",
      nombre: "Flautas y Minones",
      categoria: "clasicos",
      icono: "🥖",
      fuente: "Libro Panadería Gastón, Cap. 13",
      version: "1.0",
      estado: "publicada",
      tiempo_total: "3.5-5 h",
      temperatura_horno: "200-220°C",
      hidratacion: "58-62%",
      rinde: "8 flautas de 100 g (o 20 minones de 50 g)",
      ingredientes: {
        harina_total_g: 500,
        grupos: [{
          nombre: "Masa base",
          items: [
            { nombre: "Harina 000", cantidad: 500, unidad: "g", es_harina: true },
            { nombre: "Agua", cantidad: 300, unidad: "ml", es_harina: false },
            { nombre: "Levadura fresca", cantidad: 15, unidad: "g", es_harina: false },
            { nombre: "Sal fina", cantidad: 10, unidad: "g", es_harina: false },
            { nombre: "Extracto de malta", cantidad: 5, unidad: "g", es_harina: false }
          ]
        }]
      },
      etapas: [
        { orden: 1, nombre: "Mezclado y amasado", duracion_min: 15, descripcion: "Harina 000 + agua + levadura + sal + malta", notas_tecnicas: "TDM 24-26°C" },
        { orden: 2, nombre: "Fermentación en bloque", duracion_min: 90, descripcion: "1ª fermentación · 25-28°C · tapado", notas_tecnicas: null },
        { orden: 3, nombre: "Reposo y estirado", duracion_min: 20, descripcion: "5 vueltas de palo · 5 mm", notas_tecnicas: null },
        { orden: 4, nombre: "División y ovillado", duracion_min: 20, descripcion: "8 piezas de 100 g · cilindro", notas_tecnicas: null },
        { orden: 5, nombre: "Leudado final", duracion_min: 60, descripcion: "Duplicar volumen · 25-28°C", notas_tecnicas: null },
        { orden: 6, nombre: "Corte y horneado", duracion_min: 25, descripcion: "Cortes diagonales · 200-220°C · vapor", notas_tecnicas: null },
        { orden: 7, nombre: "Enfriado en rejilla", duracion_min: 45, descripcion: "Corteza crujiente", notas_tecnicas: null }
      ],
      consideraciones: [
        { tipo: "ok", titulo: "✓ Hidratación media", texto: "58-62%." },
        { tipo: "warn", titulo: "⚠ Vapor esencial", texto: "Los primeros 5-8 min con vapor." }
      ],
      bpm: [
        { etapa: "Recepción harina", peligro: "Bacillus cereus, mohos", control: "Proveedor habilitado", limite_critico: "Fecha vigente" },
        { etapa: "Horneado", peligro: "Supervivencia patógenos", control: "T° y tiempo", limite_critico: "200-220°C, T° int ≥85°C" }
      ],
      tips: ["💡 Recordá la prueba de membrana.", "💡 El vapor es clave para la corteza."],
      variantes: ["Minones", "Flautas integrales"],
      referencias_cruzadas: { temperaturas_relacionadas: ["Baguette / flauta"], prefermentos_sugeridos: ["poolish"], productos_similares: ["baguetines"] },
      metadata: { autor_receta: "Claudio Olijavetzky", fecha_creacion: "2025-01-15", fecha_actualizacion: "2025-01-15", tags: ["pan frances"] }
    }
  ];

  const FALLBACK_CATEGORIAS = {
    categorias: [
      { id: "clasicos", nombre: "Los Clásicos", icono: "🥖", orden: 1 },
      { id: "manteca", nombre: "Facturas de Manteca", icono: "🥐", orden: 2 },
      { id: "grasa", nombre: "Facturas de Grasa", icono: "🥟", orden: 3 },
      { id: "regionales", nombre: "Panes Regionales", icono: "🌾", orden: 4 },
      { id: "inmigrantes", nombre: "Panes de Inmigrantes", icono: "🌍", orden: 5 },
      { id: "fiesta", nombre: "Panes de Fiesta", icono: "🎉", orden: 6 },
      { id: "panettone", nombre: "Panettone", icono: "🍰", orden: 7 },
      { id: "bases", nombre: "Recetas Base", icono: "🧂", orden: 8 }
    ]
  };

  const FALLBACK_REFERENCIAS = { temperaturas: [], levaduras: [], reglas_oro: [], conversiones: [], glosario: [] };
  const FALLBACK_CONFIG = { version_db: "0.0.0-fallback", recetas_publicadas: [], recetas_borrador: [], idioma_default: "es-AR" };

  // ============================================================
  // UTILIDADES DE FETCH
  // ============================================================
  async function fetchJSON(ruta) {
    const resp = await fetch(ruta + '?v=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status} en ${ruta}`);
    return resp.json();
  }

  async function cargarBase() {
    setStatus('loading', 'Cargando base de datos…');
    APP.usandoFallback = false;

    try {
      const [recetas, categorias, referencias, config] = await Promise.all([
        fetchJSON('data/recetas.json'),
        fetchJSON('data/categorias.json'),
        fetchJSON('data/referencias.json'),
        fetchJSON('data/app_config.json')
      ]);

      APP.recetas = recetas;
      APP.categorias = categorias.categorias.reduce((acc, c) => { acc[c.id] = c; return acc; }, {});
      APP.referencias = referencias;
      APP.config = config;
      APP.cargado = true;

      setStatus('ok', 'Base cargada desde JSON');
      actualizarContadores();
    } catch (error) {
      console.warn('Error al cargar JSON, usando fallback:', error.message);
      APP.usandoFallback = true;
      APP.recetas = FALLBACK_RECETAS;
      APP.categorias = FALLBACK_CATEGORIAS.categorias.reduce((acc, c) => { acc[c.id] = c; return acc; }, {});
      APP.referencias = FALLBACK_REFERENCIAS;
      APP.config = FALLBACK_CONFIG;
      APP.cargado = true;

      setStatus('warn', 'Usando datos embebidos (fallback)');
      actualizarContadores();
      mostrarMensaje('warn', 'No se pudo cargar la base externa',
        'Se están usando datos embebidos de demostración. Para cargar la base completa, serví el archivo desde un servidor HTTP (no abras el HTML con file://).');
    }
  }

  function setStatus(tipo, texto) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className = 'dot ' + (tipo === 'ok' ? 'ok' : tipo === 'loading' ? 'loading' : '');
    text.textContent = texto;
  }

  function actualizarContadores() {
    document.getElementById('statusCount').textContent = APP.recetas.length + ' recetas';
    document.getElementById('statusVersion').textContent = APP.config.version_db || '—';

    const select = document.getElementById('recetaSelect');
    select.innerHTML = '<option value="">— Seleccionar —</option>';

    // Agrupar por categoría
    const cats = Object.values(APP.categorias).sort((a, b) => (a.orden || 99) - (b.orden || 99));
    cats.forEach(cat => {
      const recetasCat = APP.recetas.filter(r => r.categoria === cat.id && r.estado !== 'deprecada');
      if (recetasCat.length === 0) return;

      const group = document.createElement('optgroup');
      group.label = `${cat.icono} ${cat.nombre}`;
      recetasCat.forEach(r => {
        const option = document.createElement('option');
        option.value = r.id;
        const marca = r.estado === 'borrador' ? ' (borrador)' : '';
        option.textContent = `${r.icono} ${r.nombre}${marca}`;
        group.appendChild(option);
      });
      select.appendChild(group);
    });

    select.disabled = false;
    document.getElementById('btnGenerar').disabled = false;
  }

  function mostrarMensaje(tipo, titulo, texto) {
    const cont = document.getElementById('mensajes');
    const div = document.createElement('div');
    div.className = 'mensaje ' + (tipo === 'ok' ? 'info' : '');
    div.innerHTML = `<h3>${titulo}</h3><p>${texto}</p>`;
    cont.appendChild(div);
  }

  function limpiarMensajes() {
    document.getElementById('mensajes').innerHTML = '';
  }

  // ============================================================
  // FORMATEO
  // ============================================================
  function formatDuracion(minutos) {
    if (minutos < 60) return minutos + ' min';
    const h = Math.floor(minutos / 60);
    const m = minutos % 60;
    return m > 0 ? h + ' h ' + m + ' min' : h + ' h';
  }

  function formatHora(fecha) {
    return fecha.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function formatFecha(fecha) {
    return fecha.toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function formatCantidad(valor, unidad) {
    if (unidad === 'g' && valor >= 1000) {
      const kg = valor / 1000;
      return (kg % 1 === 0 ? kg : kg.toFixed(2)) + ' kg';
    }
    if (unidad === 'ml' && valor >= 1000) {
      const l = valor / 1000;
      return (l % 1 === 0 ? l : l.toFixed(2)) + ' L';
    }
    if (Number.isInteger(valor)) return valor + ' ' + unidad;
    return valor.toFixed(1) + ' ' + unidad;
  }

  function formatPct(valor) {
    if (Number.isInteger(valor)) return valor + '%';
    return valor.toFixed(1) + '%';
  }

  // ============================================================
  // CALENDARIO
  // ============================================================
  function generarCalendario(fechaInicio, horaInicio, etapas) {
    const [h, m] = horaInicio.split(':').map(Number);
    let current = new Date(fechaInicio);
    current.setHours(h, m, 0, 0);

    const calendario = [];
    etapas.forEach((etapa, idx) => {
      const inicio = new Date(current);
      const fin = new Date(current.getTime() + etapa.duracion_min * 60000);
      calendario.push({
        orden: etapa.orden || idx + 1,
        nombre: etapa.nombre,
        descripcion: etapa.descripcion,
        notas: etapa.notas_tecnicas,
        duracion: etapa.duracion_min,
        inicio,
        fin
      });
      current = fin;
    });
    return calendario;
  }

  // ============================================================
  // RENDERIZADO
  // ============================================================
  function renderReceta(recetaId, fechaInicio, horaInicio) {
    const receta = APP.recetas.find(r => r.id === recetaId);
    if (!receta) {
      mostrarMensaje('warn', 'Receta no encontrada', 'No se encontró la receta seleccionada en la base de datos.');
      return;
    }

    limpiarMensajes();
    const output = document.getElementById('recipeOutput');
    const printArea = document.getElementById('printArea');
    const calendario = generarCalendario(fechaInicio, horaInicio, receta.etapas);
    const catInfo = APP.categorias[receta.categoria] || { nombre: 'Sin categoría', icono: '📖' };

    let html = `
      <div class="recipe-header">
        <h2><span class="icon-large">${receta.icono}</span>${receta.nombre}</h2>
        <div class="recipe-meta">
          <span><strong>Categoría:</strong> ${catInfo.icono} ${catInfo.nombre}</span>
          <span><strong>Duración total:</strong> ${receta.tiempo_total}</span>
          <span><strong>Horno:</strong> ${receta.temperatura_horno}</span>
          <span><strong>Hidratación:</strong> ${receta.hidratacion}</span>
          ${receta.estado === 'borrador' ? '<span style="background:#fcf4ef;border-color:#b85c3a;"><strong>Estado:</strong> Borrador</span>' : ''}
        </div>
      </div>

      <div class="calendar-box">
        <div class="cal-item">
          <strong>Inicio</strong>
          <div class="value">${formatFecha(calendario[0].inicio)}</div>
          <div>${formatHora(calendario[0].inicio)}</div>
        </div>
        <div class="cal-item">
          <strong>Fin estimado</strong>
          <div class="value">${formatFecha(calendario[calendario.length - 1].fin)}</div>
          <div>${formatHora(calendario[calendario.length - 1].fin)}</div>
        </div>
        <div class="cal-item">
          <strong>Duración</strong>
          <div class="value">${formatDuracion(receta.etapas.reduce((a, e) => a + e.duracion_min, 0))}</div>
        </div>
      </div>
    `;

    // INGREDIENTES
    if (receta.ingredientes && receta.ingredientes.grupos) {
      const harinaTotal = receta.ingredientes.harina_total_g || 0;
      const mostrarPct = harinaTotal > 0;

      html += `
        <div class="section-title"><span class="ornament">✦</span> Ingredientes <span class="ornament">✦</span></div>
        <div class="multiplier-bar no-print">
          <span class="label-mult">Multiplicador:</span>
          <input type="number" id="multInput" value="1" min="0.1" step="0.1">
          <div class="mult-buttons">
            <button class="mult-btn" data-mult="0.5">0.5x</button>
            <button class="mult-btn active" data-mult="1">1x</button>
            <button class="mult-btn" data-mult="1.5">1.5x</button>
            <button class="mult-btn" data-mult="2">2x</button>
            <button class="mult-btn" data-mult="3">3x</button>
            <button class="mult-btn" data-mult="5">5x</button>
            <button class="mult-btn" data-mult="10">10x</button>
          </div>
        </div>
        <div class="resumen-bar">
          ${mostrarPct ? `<div><strong>Harina total</strong><span class="val" id="harinaTotalVal">${formatCantidad(harinaTotal, 'g')}</span></div>` : ''}
          ${receta.rinde ? `<div><strong>Rinde</strong><span class="val" id="rindeVal">${receta.rinde}</span></div>` : ''}
          <div><strong>Factor</strong><span class="val" id="factorVal">x1</span></div>
        </div>
        <table class="ing-table">
          <thead>
            <tr>
              <th>Ingrediente</th>
              <th class="col-num">Cantidad base</th>
              ${mostrarPct ? '<th class="col-pct">% Panadero</th>' : ''}
              <th class="col-scaled">Cantidad escalada</th>
            </tr>
          </thead>
          <tbody id="ingTableBody"></tbody>
        </table>
      `;

      // Guardar datos para el multiplicador
      output._ingredientes = receta.ingredientes;
      output._harinaTotal = harinaTotal;
      output._mostrarPct = mostrarPct;
      output._rinde = receta.rinde || '';
    }

    // FLUJO
    html += `
      <div class="section-title"><span class="ornament">✦</span> Flujo de trabajo · Paso a paso <span class="ornament">✦</span></div>
      <table class="flow-table">
        <thead>
          <tr>
            <th>#</th><th>Etapa</th><th>Duración</th><th>Inicio</th><th>Fin</th><th>Descripción</th>
          </tr>
        </thead>
        <tbody>
    `;
    calendario.forEach(item => {
      html += `
        <tr>
          <td>${item.orden}</td>
          <td class="stage-name">${item.nombre}</td>
          <td class="stage-dur">${formatDuracion(item.duracion)}</td>
          <td>${formatHora(item.inicio)}</td>
          <td>${formatHora(item.fin)}</td>
          <td class="stage-desc">${item.descripcion}${item.notas ? `<br><em style="color:#6b5a45;font-size:0.88em;">📌 ${item.notas}</em>` : ''}</td>
        </tr>
      `;
    });
    html += `</tbody></table>`;

    // CONSIDERACIONES
    html += `
      <div class="section-title"><span class="ornament">✦</span> Consideraciones técnicas <span class="ornament">✦</span></div>
      <div class="considerations-grid">
    `;
    receta.consideraciones.forEach(c => {
      const cls = c.tipo === 'warn' ? 'warn' : (c.tipo === 'ok' ? 'ok' : '');
      html += `
        <div class="consideration-card ${cls}">
          <span class="cons-title">${c.titulo}</span>
          <span class="cons-text">${c.texto}</span>
        </div>
      `;
    });
    html += `</div>`;

    // BPM
    html += `
      <div class="section-title"><span class="ornament">✦</span> Buenas Prácticas de Manufactura (BPM) <span class="ornament">✦</span></div>
      <table class="bpm-table">
        <thead>
          <tr><th>Etapa</th><th>Peligro</th><th>Control</th><th>Límite crítico</th></tr>
        </thead>
        <tbody>
    `;
    receta.bpm.forEach(b => {
      html += `
        <tr>
          <td>${b.etapa}</td>
          <td>${b.peligro}</td>
          <td>${b.control}</td>
          <td>${b.limite_critico}</td>
        </tr>
      `;
    });
    html += `</tbody></table>`;

    // TIPS
    if (receta.tips && receta.tips.length > 0) {
      html += `
        <div class="section-title"><span class="ornament">✦</span> Tips y sugerencias del obrador <span class="ornament">✦</span></div>
        <ul class="tips-list">
          ${receta.tips.map(t => `<li>${t}</li>`).join('')}
        </ul>
      `;
    }

    // VARIANTES
    if (receta.variantes && receta.variantes.length > 0) {
      html += `
        <div class="section-title"><span class="ornament">✦</span> Variantes <span class="ornament">✦</span></div>
        <ul class="tips-list">
          ${receta.variantes.map(v => `<li>${v}</li>`).join('')}
        </ul>
      `;
    }

    output.innerHTML = html;
    output.style.display = 'block';
    printArea.style.display = 'block';

    // Inicializar multiplicador
    if (receta.ingredientes && receta.ingredientes.grupos) {
      inicializarMultiplicador(output);
    }
  }

  // ============================================================
  // MULTIPLICADOR
  // ============================================================
  function renderFilasIngredientes(ingredientes, harinaTotal, mostrarPct, mult) {
    let rows = '';
    ingredientes.grupos.forEach(g => {
      if (ingredientes.grupos.length > 1 || g.nombre !== 'Ingredientes') {
        rows += `<tr><td class="group-title" colspan="${mostrarPct ? 4 : 3}">${g.nombre}</td></tr>`;
      }
      g.items.forEach(it => {
        const pct = (mostrarPct && it.unidad === 'g') ? (it.cantidad / harinaTotal) * 100 : null;
        const scaled = it.cantidad * mult;
        let scaledStr;
        if (it.unidad === 'g' || it.unidad === 'ml') {
          scaledStr = formatCantidad(scaled, it.unidad);
        } else {
          scaledStr = (Math.round(scaled * 100) / 100) + ' ' + it.unidad;
        }
        const harinaCls = it.es_harina ? ' harina-row' : '';
        const noPctCls = !mostrarPct ? ' no-pct' : '';
        rows += `
          <tr class="${harinaCls}${noPctCls}">
            <td>${it.nombre}</td>
            <td class="col-num">${formatCantidad(it.cantidad, it.unidad)}</td>
            ${mostrarPct ? `<td class="col-pct">${pct !== null ? formatPct(pct) : '—'}</td>` : ''}
            <td class="col-scaled">${scaledStr}</td>
          </tr>
        `;
      });
    });
    return rows;
  }

  function inicializarMultiplicador(output) {
    const multInput = document.getElementById('multInput');
    const multBtns = document.querySelectorAll('.mult-btn');
    const tableBody = document.getElementById('ingTableBody');
    const harinaTotalVal = document.getElementById('harinaTotalVal');
    const rindeVal = document.getElementById('rindeVal');
    const factorVal = document.getElementById('factorVal');

    const actualizar = (mult) => {
      if (mult <= 0 || isNaN(mult)) mult = 1;
      tableBody.innerHTML = renderFilasIngredientes(output._ingredientes, output._harinaTotal, output._mostrarPct, mult);
      if (harinaTotalVal && output._harinaTotal) {
        harinaTotalVal.textContent = formatCantidad(output._harinaTotal * mult, 'g');
      }
      if (rindeVal && output._rinde) {
        const match = output._rinde.match(/^(\d+)\s+(.+)$/);
        if (match) {
          const num = Math.round(parseInt(match[1]) * mult);
          rindeVal.textContent = num + ' ' + match[2];
        } else {
          rindeVal.textContent = output._rinde + (mult !== 1 ? ` · x${mult}` : '');
        }
      }
      if (factorVal) factorVal.textContent = 'x' + mult;
    };

    multInput.addEventListener('input', () => {
      const mult = parseFloat(multInput.value) || 1;
      multBtns.forEach(b => b.classList.remove('active'));
      actualizar(mult);
    });

    multBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mult = parseFloat(btn.dataset.mult);
        multInput.value = mult;
        multBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        actualizar(mult);
      });
    });

    actualizar(1);
  }

  // ============================================================
  // SERVICE WORKER
  // ============================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('✅ Service Worker registrado:', reg.scope))
        .catch(err => console.warn('⚠ Service Worker no registrado:', err.message));
    });
  }

  // ============================================================
  // INICIALIZACIÓN
  // ============================================================
  document.addEventListener('DOMContentLoaded', async () => {
    const select = document.getElementById('recetaSelect');
    const fechaInput = document.getElementById('fechaInput');
    const horaInput = document.getElementById('horaInput');
    const btn = document.getElementById('btnGenerar');
    const btnReload = document.getElementById('btnReload');

    // Fecha por defecto: hoy
    const hoy = new Date();
    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const dd = String(hoy.getDate()).padStart(2, '0');
    fechaInput.value = `${yyyy}-${mm}-${dd}`;

    // Cargar base
    await cargarBase();

    // Generar
    btn.addEventListener('click', () => {
      const recetaKey = select.value;
      const fecha = fechaInput.value;
      const hora = horaInput.value;
      if (!recetaKey) { alert('Por favor, seleccioná una receta.'); return; }
      if (!fecha || !hora) { alert('Por favor, completá fecha y hora de inicio.'); return; }
      renderReceta(recetaKey, fecha, hora);
    });

    select.addEventListener('change', () => {
      if (select.value && fechaInput.value && horaInput.value) {
        renderReceta(select.value, fechaInput.value, horaInput.value);
      }
    });

    // Recargar base
    btnReload.addEventListener('click', async () => {
      limpiarMensajes();
      document.getElementById('recipeOutput').style.display = 'none';
      document.getElementById('printArea').style.display = 'none';
      await cargarBase();
    });
  });
</script>
