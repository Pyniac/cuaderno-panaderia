<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaderno de Panadería · Años 40</title>
  <style>
    /* ===== ESTILO PANADERÍA AÑOS 40 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f3efe6;
      background-image: radial-gradient(circle at 20% 30%, #e8e0d0 0%, #d9cfbc 100%);
      font-family: 'Georgia', 'Times New Roman', 'Palatino', serif;
      color: #2c2418;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.06"/></svg>');
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ===== CABECERA ===== */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 3px double #8b6b4d;
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: normal;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4a3727;
      text-shadow: 2px 2px 0 #d9c9b0;
      margin-bottom: 0.25rem;
    }

    .header .sub {
      font-size: 1.1rem;
      font-style: italic;
      color: #6b5a45;
      letter-spacing: 2px;
    }

    .header .decoration {
      font-size: 1.8rem;
      letter-spacing: 8px;
      color: #b8956e;
      margin-top: 0.25rem;
    }

    /* ===== PANEL DE CONTROL ===== */
    .control-panel {
      background: #f9f4ea;
      border: 2px solid #b89b7a;
      border-radius: 2px;
      box-shadow: 4px 4px 0 #b89b7a, 8px 8px 0 rgba(0,0,0,0.05);
      padding: 1.75rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
      align-items: flex-end;
      justify-content: center;
    }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }

    .field label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b4f33;
      font-weight: bold;
    }

    .field select, .field input {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1rem;
      padding: 0.5rem 0.75rem;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      color: #2c2418;
      min-width: 200px;
    }

    .field select:focus, .field input:focus {
      outline: 2px solid #b8956e;
      outline-offset: 1px;
    }

    .btn {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 0.65rem 1.8rem;
      background: #6b4f33;
      color: #f9f4ea;
      border: 2px solid #4a3727;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #4a3727;
      transition: all 0.1s ease;
      font-weight: bold;
    }

    .btn:hover {
      background: #8b6b4d;
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #4a3727;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 #4a3727;
    }

    .btn-print { background: #8b6b4d; }

    /* ===== ÁREA DE RECETA ===== */
    .recipe-container {
      background: #fdfaf4;
      border: 2px solid #b89b7a;
      box-shadow: 6px 6px 0 #b89b7a, 12px 12px 0 rgba(0,0,0,0.04);
      padding: 2.5rem 3rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .recipe-container::before {
      content: "";
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px solid #d9c9b0;
      pointer-events: none;
    }

    .recipe-header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 2px solid #d9c9b0;
      padding-bottom: 1rem;
      position: relative;
    }

    .recipe-header h2 {
      font-size: 2.4rem;
      font-weight: normal;
      color: #3d2e1f;
      letter-spacing: 2px;
      margin-bottom: 0.25rem;
    }

    .recipe-header .icon-large { font-size: 2rem; margin-right: 0.5rem; }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem 2.5rem;
      margin-top: 0.75rem;
      font-size: 1rem;
      color: #5a4630;
    }

    .recipe-meta span {
      background: #f3ede3;
      padding: 0.25rem 0.9rem;
      border-radius: 20px;
      border: 1px solid #d9c9b0;
      font-style: italic;
    }

    .recipe-meta strong { font-style: normal; color: #4a3727; }

    /* ===== SECCIONES ===== */
    .section-title {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #6b4f33;
      border-bottom: 2px solid #d9c9b0;
      padding-bottom: 0.35rem;
      margin: 2rem 0 1.25rem 0;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title .ornament { font-size: 1.2rem; color: #b8956e; }

    /* ===== CALENDARIO ETERNO ===== */
    .calendar-box {
      background: #f3ede3;
      border: 2px dashed #b89b7a;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 2rem;
      justify-content: center;
    }

    .calendar-box .cal-item { font-size: 1rem; color: #3d2e1f; }

    .calendar-box .cal-item strong {
      color: #6b4f33;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.8rem;
      display: block;
    }

    .calendar-box .cal-item .value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #4a3727;
      font-family: 'Georgia', serif;
    }

    /* ===== TABLA DE INGREDIENTES ===== */
    .multiplier-bar {
      background: #f3ede3;
      border: 2px solid #b89b7a;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      justify-content: center;
    }

    .multiplier-bar .label-mult {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b4f33;
      font-weight: bold;
    }

    .multiplier-bar input[type="number"] {
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      padding: 0.4rem 0.6rem;
      width: 90px;
      text-align: center;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      color: #2c2418;
      font-weight: bold;
    }

    .mult-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .mult-btn {
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      padding: 0.35rem 0.8rem;
      background: #fffcf7;
      border: 1.5px solid #b89b7a;
      border-radius: 2px;
      cursor: pointer;
      color: #4a3727;
      font-weight: bold;
      transition: all 0.1s ease;
    }

    .mult-btn:hover { background: #e8ddc9; }

    .mult-btn.active {
      background: #6b4f33;
      color: #f9f4ea;
      border-color: #4a3727;
    }

    .resumen-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 2rem;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      background: #fffcf7;
      border: 1px solid #d9c9b0;
      font-size: 0.95rem;
      color: #3d2e1f;
    }

    .resumen-bar strong {
      color: #6b4f33;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      display: block;
    }

    .resumen-bar .val {
      font-size: 1.2rem;
      font-weight: bold;
      color: #4a3727;
    }

    .ing-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .ing-table th {
      background: #6b4f33;
      color: #f9f4ea;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.78rem;
      padding: 0.6rem 0.75rem;
      text-align: left;
      border: 1px solid #4a3727;
    }

    .ing-table td {
      padding: 0.55rem 0.75rem;
      border: 1px solid #d9c9b0;
      background: #fffcf7;
      vertical-align: middle;
    }

    .ing-table tr:nth-child(even) td { background: #f9f4ea; }

    .ing-table .group-title {
      background: #e8ddc9 !important;
      font-weight: bold;
      color: #4a3727;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
    }

    .ing-table .col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ing-table .col-pct {
      text-align: right;
      color: #6b5a45;
      font-style: italic;
      white-space: nowrap;
    }

    .ing-table .col-scaled {
      text-align: right;
      font-weight: bold;
      color: #4a3727;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ing-table .harina-row td {
      background: #f2e8d5 !important;
      font-weight: bold;
    }

    .ing-table .no-pct td.col-pct { color: #b0a08c; }

    /* ===== FLUJO ===== */
    .flow-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .flow-table th {
      background: #6b4f33;
      color: #f9f4ea;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.8rem;
      padding: 0.6rem 0.75rem;
      text-align: left;
      border: 1px solid #4a3727;
    }

    .flow-table td {
      padding: 0.65rem 0.75rem;
      border: 1px solid #d9c9b0;
      vertical-align: top;
      background: #fffcf7;
    }

    .flow-table tr:nth-child(even) td { background: #f9f4ea; }
    .flow-table .stage-name { font-weight: bold; color: #4a3727; }
    .flow-table .stage-dur { white-space: nowrap; font-style: italic; color: #6b5a45; }
    .flow-table .stage-desc { color: #3d2e1f; }

    /* ===== CONSIDERACIONES ===== */
    .considerations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .consideration-card {
      background: #f9f4ea;
      border-left: 4px solid #b8956e;
      padding: 0.9rem 1rem;
      border-radius: 0 2px 2px 0;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.04);
    }

    .consideration-card .cons-title {
      font-weight: bold;
      color: #4a3727;
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    .consideration-card .cons-text {
      font-size: 0.92rem;
      color: #3d2e1f;
      line-height: 1.5;
    }

    .consideration-card.warn { border-left-color: #b85c3a; background: #fcf4ef; }
    .consideration-card.ok { border-left-color: #5a8b5a; background: #f2f7f0; }

    /* ===== BPM TABLA ===== */
    .bpm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .bpm-table th {
      background: #8b6b4d;
      color: #f9f4ea;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.75rem;
      padding: 0.5rem 0.6rem;
      text-align: left;
      border: 1px solid #6b4f33;
    }

    .bpm-table td {
      padding: 0.5rem 0.6rem;
      border: 1px solid #d9c9b0;
      background: #fffcf7;
      vertical-align: top;
    }

    .bpm-table tr:nth-child(even) td { background: #f9f4ea; }

    /* ===== TIPS ===== */
    .tips-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 0.75rem;
    }

    .tips-list li {
      background: #f9f4ea;
      padding: 0.6rem 1rem 0.6rem 2.2rem;
      border: 1px solid #d9c9b0;
      position: relative;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .tips-list li::before {
      content: "✦";
      position: absolute;
      left: 0.7rem;
      top: 0.6rem;
      color: #b8956e;
      font-size: 1rem;
    }

    .print-area { text-align: center; margin: 2rem 0 1rem; }

    @media (max-width: 700px) {
      .header h1 { font-size: 2rem; letter-spacing: 2px; }
      .recipe-container { padding: 1.5rem; }
      .recipe-header h2 { font-size: 1.7rem; }
      .control-panel { flex-direction: column; align-items: stretch; }
      .field select, .field input { min-width: auto; width: 100%; }
    }

    /* ===== IMPRESIÓN ===== */
    @media print {
      body { background: white; padding: 0.5cm; font-size: 11pt; }
      body::before { display: none; }
      .wrapper { max-width: 100%; }
      .control-panel, .print-area, .no-print { display: none !important; }
      .recipe-container {
        box-shadow: none;
        border: 1px solid #000;
        padding: 0.8cm;
        margin: 0;
        page-break-inside: avoid;
      }
      .recipe-container::before { display: none; }
      .header { border-bottom: 2px solid #000; }
      .header h1 { font-size: 22pt; text-shadow: none; }
      .section-title { border-bottom: 1px solid #000; color: #000; margin-top: 1cm; }
      .flow-table th, .bpm-table th, .ing-table th {
        background: #ddd; color: #000; border: 1px solid #000;
      }
      .flow-table td, .bpm-table td, .ing-table td {
        border: 1px solid #999; background: white !important;
      }
      .ing-table .group-title { background: #eee !important; }
      .ing-table .harina-row td { background: #f0f0f0 !important; }
      .consideration-card { border-left: 3px solid #666; background: #f5f5f5 !important; box-shadow: none; }
      .consideration-card.warn { border-left-color: #a00; }
      .consideration-card.ok { border-left-color: #060; }
      .tips-list li { background: #f5f5f5 !important; border: 1px solid #999; }
      .calendar-box { border: 1px dashed #666; background: #f5f5f5 !important; }
      .calendar-box .cal-item .value { color: #000; }
      .multiplier-bar { background: #f5f5f5 !important; border: 1px solid #666; }
      .resumen-bar { background: #f5f5f5 !important; border: 1px solid #666; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <header class="header">
    <h1>Cuaderno de Panadería</h1>
    <div class="sub">Recetas, flujos y secretos del obrador · Años 40</div>
    <div class="decoration">✦ ✦ ✦</div>
  </header>

  <div class="control-panel no-print">
    <div class="field">
      <label for="recetaSelect">Elegir receta</label>
      <select id="recetaSelect">
        <option value="">— Seleccionar —</option>
      </select>
    </div>
    <div class="field">
      <label for="fechaInput">Fecha de inicio</label>
      <input type="date" id="fechaInput">
    </div>
    <div class="field">
      <label for="horaInput">Hora de inicio</label>
      <input type="time" id="horaInput" value="06:00">
    </div>
    <button class="btn" id="btnGenerar">Generar ficha</button>
  </div>

  <div id="recipeOutput" class="recipe-container" style="display: none;"></div>

  <div class="print-area no-print" id="printArea" style="display: none;">
    <button class="btn btn-print" onclick="window.print()">🖨 Imprimir ficha</button>
  </div>

</div>

<script>
  // ============================================================
  // CATEGORÍAS

  const CATEGORIAS = {

  // ============================================================

  const PROCESOS = {
    // --- CLÁSICOS ---
    flautas: {

          { nombre: 'Relleno', items: [

  // ============================================================
  // UTILIDADES
  // ============================================================
  function formatDuracion(minutos) {
    if (minutos < 60) return minutos + ' min';
    const h = Math.floor(minutos / 60);
    const m = minutos % 60;
    return m > 0 ? h + ' h ' + m + ' min' : h + ' h';
  }

  function formatHora(fecha) {
    return fecha.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function formatFecha(fecha) {
    return fecha.toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  // Formatea números: entero si no tiene decimales, 1 decimal si los tiene.
  // Convierte a kg si supera 1000 g. Convierte a L si supera 1000 ml.
  function formatCantidad(valor, unidad) {
    if (unidad === 'g' && valor >= 1000) {
      const kg = valor / 1000;
      return (kg % 1 === 0 ? kg : kg.toFixed(2)) + ' kg';
    }
    if (unidad === 'ml' && valor >= 1000) {
      const l = valor / 1000;
      return (l % 1 === 0 ? l : l.toFixed(2)) + ' L';
    }
    if (Number.isInteger(valor)) return valor + ' ' + unidad;
    return valor.toFixed(1) + ' ' + unidad;
  }

  // Formatea porcentaje panadero
  function formatPct(valor) {
    if (Number.isInteger(valor)) return valor + '%';
    return valor.toFixed(1) + '%';
  }

  // ============================================================
  // GENERACIÓN DEL CALENDARIO ETERNO
  // ============================================================
  function generarCalendario(fechaInicio, horaInicio, stages) {
    const [h, m] = horaInicio.split(':').map(Number);
    let current = new Date(fechaInicio);
    current.setHours(h, m, 0, 0);

    const calendario = [];
    stages.forEach((stage, idx) => {
      const inicio = new Date(current);
      const fin = new Date(current.getTime() + stage.dur * 60000);
      calendario.push({
        orden: idx + 1,
        name: stage.name,
        desc: stage.desc,
        dur: stage.dur,
        inicio: new Date(inicio),
        fin: new Date(fin)
      });
      current = fin;
    });
    return calendario;
  }

  // ============================================================

  function renderReceta(recetaKey, fechaInicio, horaInicio) {

    const output = document.getElementById('recipeOutput');

    // ============================================

    if (receta.ingredients && receta.ingredients.groups) {
      // Detectar si hay harina para mostrar columna %%
      let harinaTotal = 0;
      receta.ingredients.groups.forEach(g => {
        g.items.forEach(it => {
          if (it.esHarina) harinaTotal += it.cantidad;
        });
      });
      // Si no hay ninguna marcada como esHarina, buscar la primera que contenga "harina"
      if (harinaTotal === 0) {
        for (const g of receta.ingredients.groups) {
          for (const it of g.items) {
            if (it.nombre.toLowerCase().includes('harina') && it.unidad === 'g') {
              harinaTotal += it.cantidad;

          }
        }
      }
      const mostrarPct = harinaTotal > 0;

      html += `

        <div class="resumen-bar">

      // Función para renderizar las filas según multiplicador
      const renderFilas = (mult) => {
        let rows = '';
        receta.ingredients.groups.forEach(g => {
          if (receta.ingredients.groups.length > 1 || g.nombre !== 'Ingredientes') {

          }
          g.items.forEach(it => {

            const scaled = it.cantidad * mult;
            // Para unidades que no son g/ml (u, cdas, etc.), redondear a 2 decimales
            let scaledStr;
            if (it.unidad === 'g' || it.unidad === 'ml') {
              scaledStr = formatCantidad(scaled, it.unidad);
            } else if (it.unidad === 'u' || it.unidad === 'fetas' || it.unidad === 'láminas') {
              scaledStr = (Math.round(scaled * 100) / 100) + ' ' + it.unidad;
            } else {

            const harinaCls = it.esHarina ? ' harina-row' : '';

            rows += `

                <td class="col-scaled">${scaledStr}</td>
              </tr>
            `;
          });
        });
        return rows;
      };

      html += renderFilas(1); // Inicial

      html += `
          </tbody>
        </table>
      `;

      // Guardar función para actualizar
      output._renderFilas = renderFilas;
      output._mostrarPct = mostrarPct;
      output._harinaTotal = harinaTotal;
      output._rinde = receta.rinde;
    }

    // Flujo de trabajo
    html += `
      <div class="section-title"><span class="ornament">✦</span> Flujo de trabajo · Paso a paso <span class="ornament">✦</span></div>
      <table class="flow-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Etapa</th>
            <th>Duración</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody>
    `;

    calendario.forEach(item => {
      html += `
        <tr>
          <td>${item.orden}</td>

    html += `</div>`;

    // BPM
    html += `
      <div class="section-title"><span class="ornament">✦</span> Buenas Prácticas de Manufactura (BPM) <span class="ornament">✦</span></div>
      <table class="bpm-table">
        <thead>
          <tr>

            <th>Límite crítico</th>

        </thead>
        <tbody>
    `;

    receta.bpm.forEach(b => {
      html += `
        <tr>
          <td>${b.etapa}</td>
          <td>${b.peligro}</td>
          <td>${b.control}</td>

        </tr>
      `;
    });

    html += `</tbody></table>`;

    // Tips
    const tips = [];
    if (receta.cat === 'clasicos') {
      tips.push('💡 Recordá la prueba de membrana: estirá un trozo de masa; si forma una lámina translúcida sin romperse, el gluten está desarrollado.');
      tips.push('💡 El vapor en los primeros minutos de horneado es clave para una corteza crujiente.');
    } else if (receta.cat === 'manteca') {
      tips.push('💡 La manteca del empaste debe estar fría pero plástica (15-18°C). Si está muy dura, se rompe; si está muy blanda, se absorbe en la masa.');
      tips.push('💡 Respetá los fríos entre vueltas: la masa debe estar a 4-8°C para que la manteca no se derrita.');
    } else if (receta.cat === 'grasa') {
      tips.push('💡 La grasa de cerdo o vacuna tiene un punto de fusión más alto que la manteca. Ideal para climas cálidos.');
      tips.push('💡 No te saltees los reposos de 20 minutos entre ovillados: el gluten se relaja y la masa no se rompe.');

      tips.push('💡 El Lievito Madre debe triplicar su volumen en 3-4 horas. Si no lo hace, no está listo.');
      tips.push('💡 La temperatura de la masa nunca debe superar los 28°C, o la manteca se funde y la miga pierde estructura.');

      tips.push('💡 Las masas regionales suelen tener poca hidratación. Amasá hasta que la masa se despegue de la mesa.');
      tips.push('💡 Para las chipas, la fécula de mandioca no tiene gluten: la estructura se logra por gelatinización del almidón.');

      tips.push('💡 Las esponjas de fermentación larga (12-24 h) desarrollan sabores complejos y mejoran la conservación.');
      tips.push('💡 Para el pan con miel, el leudado en molde debe superar el borde 1 cm antes de hornear.');

    } else if (receta.cat === 'bases') {
      tips.push('💡 La crema pastelera debe cocinarse hasta 85°C para pasteurizar la yema, pero sin hervir.');
      tips.push('💡 El almíbar con unas gotas de limón evita que el azúcar cristalice.');
    }

    const tempRef = REFERENCIAS.temperaturas.find(t => 
      receta.name.toLowerCase().includes(t.producto.toLowerCase().split(' ')[0])
    );
    if (tempRef) {

    // ============================================

    if (receta.ingredients && receta.ingredients.groups) {

      const harinaTotalVal = document.getElementById('harinaTotalVal');
      const rindeVal = document.getElementById('rindeVal');
      const factorVal = document.getElementById('factorVal');

      const actualizar = (mult) => {
        if (mult <= 0 || isNaN(mult)) mult = 1;
        // Actualizar tabla
        tableBody.innerHTML = output._renderFilas(mult);
        // Actualizar resumen
        if (harinaTotalVal && output._harinaTotal) {
          harinaTotalVal.textContent = formatCantidad(output._harinaTotal * mult, 'g');
        }
        if (rindeVal && output._rinde) {
          // Intentar escalar el rinde si es numérico al inicio
          const match = output._rinde.match(/^(\d+)\s+(.+)$/);
          if (match) {
            const num = Math.round(parseInt(match[1]) * mult);
            rindeVal.textContent = num + ' ' + match[2];
          } else {
            rindeVal.textContent = output._rinde + (mult !== 1 ? ` · x${mult}` : '');
          }
        }
        if (factorVal) {
          factorVal.textContent = 'x' + mult;
        }
      };

      multInput.addEventListener('input', () => {
        const mult = parseFloat(multInput.value) || 1;
        multBtns.forEach(b => b.classList.remove('active'));
        actualizar(mult);
      });

      multBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const mult = parseFloat(btn.dataset.mult);
          multInput.value = mult;
          multBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          actualizar(mult);
        });
      });

      // Establecer estado inicial x1
      actualizar(1);
    }

  document.addEventListener('DOMContentLoaded', () => {

    const cats = Object.entries(CATEGORIAS).sort((a,b) => a[1].orden - b[1].orden);
    cats.forEach(([catKey, catInfo]) => {
      const group = document.createElement('optgroup');
      group.label = `${catInfo.icono} ${catInfo.nombre}`;
      Object.entries(PROCESOS).forEach(([key, receta]) => {

          option.textContent = `${receta.icon} ${receta.name}`;
          group.appendChild(option);
        }
      });
      select.appendChild(group);
    });

    // Fecha por defecto: hoy
    const hoy = new Date();
    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const dd = String(hoy.getDate()).padStart(2, '0');
    fechaInput.value = `${yyyy}-${mm}-${dd}`;

    btn.addEventListener('click', () => {

      if (!fecha || !hora) { alert('Por favor, completá fecha y hora de inicio.'); return; }
      renderReceta(recetaKey, fecha, hora);
    });
